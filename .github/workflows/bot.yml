name: Soliq bot
on:
  workflow_dispatch:
  schedule:
    - cron: "57 3 * * *"    # Toshkent 08:57
    - cron: "57 12 * * *"   # Toshkent 17:57
permissions:
  contents: write
jobs:
  yuborish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Holatni saqlash
        if: always()
        run: |
          [ -f holat.json ] || exit 0
          git config user.name "soliq-bot"
          git config user.email "bot@users.noreply.github.com"
          git add holat.json
          git diff --cached --quiet || (git commit -m "holat yangilandi" && git push)
